name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    env:
      # Il database di test è il servizio mysql qui sotto (le variabili vincono su .env).
      # Porta 3307 e non 3306: con act (https://github.com/nektos/act) il job gira sulla
      # rete dell'host, dove la 3306 è spesso già occupata dal MySQL locale.
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3307
      DB_TEST_USER: tavolo
      DB_TEST_PASSWORD: tavolo_test
      DB_TEST_NAME: tavolo_test
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tavolo_test
          MYSQL_USER: tavolo
          MYSQL_PASSWORD: tavolo_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
