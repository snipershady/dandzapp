# Tavolo virtuale – nginx (staging, Debian 13). §15.5 di CLAUDE.md.
#
# Sostituisci staging.dandzapp.spinfo.it con il nome vero del server di staging
# (anche in APP_URL di /etc/tavolo/tavolo.env).
# Installazione: sudo cp deploy/nginx/dandzapp-staging.conf /etc/nginx/sites-available/
#                sudo ln -s ../sites-available/dandzapp-staging.conf /etc/nginx/sites-enabled/
#                sudo nginx -t && sudo systemctl reload nginx
# Certificato (prima volta, vedi deploy/GUIDA.md):
#   sudo certbot certonly --webroot -w /var/www/html -d staging.dandzapp.spinfo.it
#
# nginx non fa controlli di permesso e non serve file dell'app: tutto passa da Node,
# che verifica partecipazione e nebbia anche per le immagini delle mappe.

# Upgrade a WebSocket solo quando il client lo chiede.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: solo il rinnovo del certificato e il passaggio a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name staging.dandzapp.spinfo.it;

    # Stessa cartella del sito predefinito di Debian: il primo certificato si ottiene
    # prima di attivare questo sito, i rinnovi funzionano anche dopo.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.dandzapp.spinfo.it;

    ssl_certificate     /etc/letsencrypt/live/staging.dandzapp.spinfo.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.dandzapp.spinfo.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # Intestazioni di sicurezza. La CSP vera (con l'hash dello script di avvio) è nel
    # <meta> generato da SvelteKit; qui ci sono le direttive che un <meta> non può dare.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    # Lo staging non va nei motori di ricerca.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    client_max_body_size 1m;

    # Proxy verso Node: HTTP e WebSocket di Socket.IO sullo stesso indirizzo.
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Senza un timeout lungo nginx chiude i collegamenti in tempo reale inattivi.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
