# Tavolo virtuale – Apache2 (produzione, Debian 13). §15.5 di CLAUDE.md.
#
# Moduli: sudo a2enmod proxy proxy_http proxy_wstunnel headers ssl rewrite deflate
# Installazione: sudo cp deploy/apache2/dandzapp.conf /etc/apache2/sites-available/
#                sudo a2ensite dandzapp && sudo apache2ctl configtest && sudo systemctl reload apache2
# Certificato (prima volta, vedi deploy/GUIDA.md):
#   sudo certbot certonly --webroot -w /var/www/html -d dandzapp.spinfo.it
#
# Apache non fa controlli di permesso e non serve file dell'app: tutto passa da Node,
# che verifica partecipazione e nebbia anche per le immagini delle mappe.

# --- HTTP: solo il rinnovo del certificato e il passaggio a HTTPS
<VirtualHost *:80>
    ServerName dandzapp.spinfo.it

    # Stessa cartella del sito predefinito di Debian: il primo certificato si ottiene
    # prima di attivare questo sito, i rinnovi funzionano anche dopo.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://dandzapp.spinfo.it%{REQUEST_URI} [R=301,L]
</VirtualHost>

# --- HTTPS
<VirtualHost *:443>
    ServerName dandzapp.spinfo.it

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/dandzapp.spinfo.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dandzapp.spinfo.it/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off
    SSLSessionTickets     off

    # Intestazioni di sicurezza. La CSP vera (con l'hash dello script di avvio) è nel
    # <meta> generato da SvelteKit; qui ci sono le direttive che un <meta> non può dare.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

    # Compressione dei testi (le immagini PNG sono già compresse).
    AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json image/svg+xml

    # Proxy verso Node: HTTP e WebSocket di Socket.IO sullo stesso indirizzo.
    # upgrade=websocket richiede Apache >= 2.4.47 (Debian 13 ha la 2.4.6x).
    ProxyRequests     Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:3010/ upgrade=websocket timeout=3600
    ProxyPassReverse / http://127.0.0.1:3010/

    # Il corpo delle richieste è piccolo (comandi, moduli): niente caricamenti grandi.
    LimitRequestBody 1048576

    ErrorLog  ${APACHE_LOG_DIR}/dandzapp-error.log
    CustomLog ${APACHE_LOG_DIR}/dandzapp-access.log combined
</VirtualHost>
